services:
  qbittorrent:
    container_name: qbittorrent
    image: lscr.io/linuxserver/qbittorrent:latest
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Kuching
      - WEBUI_PORT=8080
      - TORRENTING_PORT=6881
      - DOCKER_MODS=ghcr.io/vuetorrent/vuetorrent-lsio-mod:latest
    volumes:
      - /home/itm154/.docker/qbittorrent/config:/config
      - /home/itm154/.data/torrents:/data/torrents
    ports:
      # - 8080:8080
      - 6881:6881
      - 6881:6881/udp
    restart: unless-stopped
    networks:
      - web-proxy
  qbitwebui:
    image: ghcr.io/maciejonos/qbitwebui:latest
    container_name: qbitwebui
    ports:
      - 3000:3000
    volumes:
      - /home/itm154/.docker/qbitwebui/data:/data
      - /home/itm154/Downloads/Torrents:/downloads:ro
    environment:
      - ENCRYPTION_KEY=83fbfc59fa75644d28a9a6019906768c940be222ad4d01dcb42d4136033d9c67
      - DOWNLOADS_PATH=/downloads
    restart: unless-stopped
    networks:
      - web-proxy
networks:
  web-proxy:
    external: true
