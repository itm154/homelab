services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Kuching
      - JELLYFIN_PublishedServerUrl=http://192.168.0.5 #optional
      - NVIDIA_VISIBLE_DEVICES=all
    volumes:
      - /home/itm154/.containers/jellyfin/config:/config
      - /home/itm154/.containers/jellyfin/cache:/cache
      - /home/itm154/.data/media/tv/:/data/tv
      - /home/itm154/.data/media/movies/:/data/movies
      - /home/itm154/.data/media/music:/data/music
    ports:
      - 8096:8096
      - 7359:7359/udp
      - 1900:1900/udp
    networks:
      - web-proxy
    devices:
      - nvidia.com/gpu=all
networks:
  web-proxy:
    external: true
