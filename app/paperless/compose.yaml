services:
  broker:
    container_name: paperless-broker
    image: docker.io/valkey/valkey:8-alpine
    restart: unless-stopped
    volumes:
      - ${DOCKER_DIR}/paperless/redis:/data
    networks:
      - proxy_net

  db:
    container_name: paperless-db
    image: docker.io/library/postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: paperless
      POSTGRES_USER: paperless
      POSTGRES_PASSWORD: paperless
    volumes:
      - ${DOCKER_DIR}/paperless/db:/var/lib/postgresql/data
    networks:
      - proxy_net

  paperless:
    container_name: paperless
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    restart: unless-stopped
    depends_on:
      - db
      - broker
    # ports:
    #   - "8000:8000"
    volumes:
      - ${DOCKER_DIR}/paperless/data:/usr/src/paperless/data
      - ${DOCKER_DIR}/paperless/export:/usr/src/paperless/export
      - ${MEDIA_DIR}/paperless/media:/usr/src/paperless/media
      - ${MEDIA_DIR}/paperless/consume:/usr/src/paperless/consume
    environment:
      USERMAP_UID: ${PUID}
      USERMAP_GID: ${PGID}
      PAPERLESS_TIME_ZONE: ${TZ}
      PAPERLESS_OCR_LANGUAGE: eng
      PAPERLESS_OCR_LANGUAGES: msa
      PAPERLESS_SECRET_KEY: ${PAPERLESS_SECRET_KEY}
      PAPERLESS_REDIS: redis://paperless-broker:6379
      PAPERLESS_DBHOST: paperless-db
      PAPERLESS_DBENGINE: postgresql
      PAPERLESS_DBNAME: paperless
      PAPERLESS_DBUSER: paperless
      PAPERLESS_DBPASS: paperless
      PAPERLESS_URL: http://paperless.apollo.lab
      PAPERLESS_CSRF_TRUSTED_ORIGINS: http://paperless.apollo.lab,https://paperless.apollo.lab
    networks:
      - proxy_net

networks:
  proxy_net:
    external: true
