services:
  transmute:
    image: ghcr.io/transmute-app/transmute:latest
    container_name: transmute
    restart: unless-stopped
    volumes:
      - ${DOCKER_DATA}/transmute/data:/app/data
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
    networks:
      - proxy_net
    healthcheck:
      test:
        - "CMD"
        - "wget"
        - "-q"
        - "-O"
        - "/dev/null"
        - "--tries=1"
        - "http://localhost:3313/api/health/ready"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
networks:
  proxy_net:
    external: true
