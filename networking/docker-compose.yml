services:
  nginx-proxy-manager:
    container_name: nginx-proxy-manager
    image: 'jc21/nginx-proxy-manager:latest'
    restart: unless-stopped
    ports:
      - '80:80' # Public HTTP Port
      - '443:443' # Public HTTPS Port
      - '81:81' # Admin Web Port
    environment:
      TZ: "Asia/Kuching"
    volumes:
      - /home/itm154/.containers/nginx-proxy-manager/config:/data
      - ./letsencrypt:/etc/letsencrypt
    networks:
      - web-proxy
  # adguardhome:
  #   container_name: adguardhome
  #   image: 'adguard/adguardhome:latest'
  #   restart: unless-stopped
  #   network_mode: host
  #   volumes:
  #     - /home/itm154/.containers/adguardhome/work:/opt/adguardhome/work
  #     - /home/itm154/.containers/adguardhome/conf:/opt/adguardhome/conf
  #   environment:
  #     TZ: "Asia/Kuching"
networks:
  web-proxy:
    external: true
