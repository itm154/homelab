services:
  fileflows:
    container_name: fileflows
    image: revenz/fileflows:stable
    restart: unless-stopped
    build:
      context: .
      args:
        BASE_TAG: stable
    # ports:
    #   - "19200:5000"
    devices:
      - /dev/dri:/dev/dri
      - nvidia.com/gpu=all
    environment:
      - TempPathHost=/home/itm154/.containers/fileflows/temp
      - TZ=Asia/Kuching
      - PUID=1000
      - PGID=1000
      - NVIDIA_DRIVER_CAPABILITIES=compute,video,utility
      - NVIDIA_VISIBLE_DEVICES=all
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /home/itm154/.containers/fileflows/temp:/temp
      - /home/itm154/.containers/fileflows/config:/app/Data
      - /home/itm154/.containers/fileflows/logs:/app/Logs
      - /home/itm154/.data/media:/media
    networks:
      - web-proxy
networks:
  web-proxy:
    external: true
