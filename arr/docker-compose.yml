services:
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    restart: unless-stopped
    # ports:
    #   - 8989:8989
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Kuching
    volumes:
      - /home/itm154/.docker/sonarr/config:/config
      - /home/itm154/.data/:/data
    networks:
      - web-proxy
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    restart: unless-stopped
    # ports:
    #   - 7878:7878
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Kuching
    volumes:
      - /home/itm154/.docker/radarr/config:/config
      - /home/itm154/.data/:/data
    networks:
      - web-proxy
  prowlarr:
    container_name: prowlarr
    image: lscr.io/linuxserver/prowlarr:latest
    restart: unless-stopped
    # ports:
    #   - 9696:9696
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Kuching
    volumes:
      - /home/itm154/.docker/prowlarr/config:/config
    networks:
      - web-proxy
  lidarr:
    container_name: lidarr
    image: lscr.io/linuxserver/lidarr:latest
    restart: unless-stopped
    # ports:
    #   - 8686:8686
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Kuching
    volumes:
      - /home/itm154/.docker/lidarr/config:/config
      - /home/itm154/.data/:/data
    networks:
      - web-proxy
  tdarr:
    container_name: tdarr
    image: ghcr.io/haveagitgat/tdarr:latest
    restart: unless-stopped
    # ports:
    #   - 8265:8265 # webUI port
    #   - 8266:8266 # server port
    environment:
      - TZ=Asia/Kuching
      - PUID=1000
      - PGID=1000
      - UMASK_SET=002
      - serverIP=0.0.0.0
      - serverPort=8266
      - webUIPort=8265
      - internalNode=true
      - inContainer=true
      - ffmpegVersion=7
      - nodeName=InternalNode
      - auth=false
      - openBrowser=true
      - maxLogSizeMB=10
      - cronPluginUpdate=
      - NVIDIA_DRIVER_CAPABILITIES=all
      - NVIDIA_VISIBLE_DEVICES=all
    volumes:
      - /home/itm154/.docker/tdarr/server:/app/server
      - /home/itm154/.docker/tdarr/configs:/app/configs
      - /home/itm154/.docker/tdarr/logs:/app/logs
      - /home/itm154/.data/media:/media
      - ./transcode_cache:/temp
    devices:
      - /dev/dri:/dev/dri
    networks:
      - web-proxy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
networks:
  web-proxy:
    external: true
